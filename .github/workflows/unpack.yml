name: Extract App Source

on:
  push:
    paths:
      - 'Tattoo_Artists_Crib_Source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o Tattoo_Artists_Crib_Source.zip -d .
          rm Tattoo_Artists_Crib_Source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pubspec.yaml lib android
          git diff --cached --quiet || (git commit -m "Extract app source" && git push)
